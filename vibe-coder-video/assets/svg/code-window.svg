<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark theme code editor window -->
  <!-- Window chrome -->
  <rect x="0" y="0" width="900" height="500" rx="16" fill="#1E1E2E"/>
  <rect x="0" y="0" width="900" height="500" rx="16" stroke="#3A3A4A" stroke-width="2" fill="none"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="48" rx="16" fill="#252536"/>
  <rect x="0" y="40" width="900" height="8" fill="#252536"/> <!-- cover bottom radius -->
  
  <!-- Traffic lights -->
  <circle cx="20" cy="24" r="7" fill="#FF5F57"/>
  <circle cx="40" cy="24" r="7" fill="#FEBC2E"/>
  <circle cx="60" cy="24" r="7" fill="#28CA42"/>
  
  <!-- Tab bar -->
  <rect x="0" y="48" width="900" height="40" fill="#1E1E2E"/>
  <rect x="0" y="88" width="900" height="1" fill="#3A3A4A"/>
  
  <!-- Tabs -->
  <rect x="8" y="48" width="140" height="36" rx="6" fill="#2D2D3A"/>
  <text x="18" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#F8F8F2">main.py</text>
  <circle cx="18" cy="66" r="4" fill="#28CA42"/>
  
  <rect x="156" y="48" width="140" height="36" rx="6" fill="#252536"/>
  <text x="166" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#8B8B8B">utils.py</text>
  
  <rect x="304" y="48" width="140" height="36" rx="6" fill="#252536"/>
  <text x="314" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#8B8B8B">config.json</text>
  
  <!-- New tab button -->
  <circle cx="870" cy="68" r="10" fill="none" stroke="#5A5A6A" stroke-width="1.5"/>
  <text x="870" y="73" font-family="JetBrains Mono, monospace" font-size="16" fill="#5A5A6A" text-anchor="middle">+</text>
  
  <!-- Editor area -->
  <rect x="0" y="89" width="900" height="411" fill="#16161D"/>
  
  <!-- Line numbers gutter -->
  <rect x="0" y="89" width="60" height="411" fill="#1E1E2E"/>
  <text x="55" y="125" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">1</text>
  <text x="55" y="150" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">2</text>
  <text x="55" y="175" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">3</text>
  <text x="55" y="200" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">4</text>
  <text x="55" y="225" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">5</text>
  <text x="55" y="250" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">6</text>
  <text x="55" y="275" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">7</text>
  <text x="55" y="300" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">8</text>
  <text x="55" y="325" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">9</text>
  <text x="55" y="350" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">10</text>
  <text x="55" y="375" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">11</text>
  <text x="55" y="400" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">12</text>
  <text x="55" y="425" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">13</text>
  <text x="55" y="450" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">14</text>
  <text x="55" y="475" font-family="JetBrains Mono, monospace" font-size="13" fill="#4A4A5A" text-anchor="end">15</text>
  
  <!-- Code content -->
  <!-- Line 1 -->
  <text x="75" y="125" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">def</tspan> <tspan fill="#50FA7B">process_habits</tspan><tspan fill="#FF79C6">(</tspan><tspan fill="#F8F8F2">habit_list</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#8BE9FD">List</tspan><tspan fill="#FF79C6">[</tspan><tspan fill="#8BE9FD">Habit</tspan><tspan fill="#FF79C6">]</tspan><tspan fill="#FF79C6">)</tspan> <tspan fill="#FF79C6">-></tspan> <tspan fill="#8BE9FD">Dict</tspan><tspan fill="#FF79C6">:</tspan>
  </text>
  <!-- Line 2 -->
  <text x="95" y="150" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#6272A4"># Process habits and calculate streaks</tspan>
  </text>
  <!-- Line 3 -->
  <text x="95" y="175" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#8BE9FD">results</tspan> <tspan fill="#FF79C6">=</tspan> <tspan fill="#FF79C6">{</tspan>
  </text>
  <!-- Line 4 -->
  <text x="115" y="200" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#F1FA8C">"coding"</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#BD93F9">calculate_streak</tspan><tspan fill="#FF79C6">(</tspan><tspan fill="#F8F8F2">habit_list</tspan><tspan fill="#FF79C6">[</tspan><tspan fill="#BD93F9">0</tspan><tspan fill="#FF79C6">])</tspan><tspan fill="#FF79C6">,</tspan>
  </text>
  <!-- Line 5 -->
  <text x="115" y="225" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#F1FA8C">"workout"</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#BD93F9">calculate_streak</tspan><tspan fill="#FF79C6">(</tspan><tspan fill="#F8F8F2">habit_list</tspan><tspan fill="#FF79C6">[</tspan><tspan fill="#BD93F9">1</tspan><tspan fill="#FF79C6">])</tspan><tspan fill="#FF79C6">,</tspan>
  </text>
  <!-- Line 6 -->
  <text x="95" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">}</tspan>
  </text>
  <!-- Line 7 -->
  <text x="95" y="275" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">return</tspan> <tspan fill="#8BE9FD">results</tspan>
  </text>
  <!-- Line 8 (empty) -->
  <!-- Line 9 -->
  <text x="75" y="325" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">def</tspan> <tspan fill="#50FA7B">calculate_streak</tspan><tspan fill="#FF79C6">(</tspan><tspan fill="#F8F8F2">habit</tspan><tspan fill="#FF79C6">):</tspan>
  </text>
  <!-- Line 10 -->
  <text x="95" y="350" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#6272A4"># Returns current streak count</tspan>
  </text>
  <!-- Line 11 -->
  <text x="95" y="375" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#8BE9FD">streak</tspan> <tspan fill="#FF79C6">=</tspan> <tspan fill="#BD93F9">0</tspan>
  </text>
  <!-- Line 12 -->
  <text x="95" y="400" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">for</tspan> <tspan fill="#F8F8F2">day</tspan> <tspan fill="#FF79C6">in</tspan> <tspan fill="#F8F8F2">habit.days</tspan><tspan fill="#FF79C6">:</tspan>
  </text>
  <!-- Line 13 -->
  <text x="115" y="425" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">if</tspan> <tspan fill="#F8F8F2">day.completed</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#8BE9FD">streak</tspan> <tspan fill="#FF79C6">+=</tspan> <tspan fill="#BD93F9">1</tspan>
  </text>
  <!-- Line 14 -->
  <text x="115" y="450" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">else</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#FF79C6">break</tspan>
  </text>
  <!-- Line 15 -->
  <text x="95" y="475" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2">
    <tspan fill="#FF79C6">return</tspan> <tspan fill="#8BE9FD">streak</tspan>
  </text>
  
  <!-- Blinking cursor on line 15 -->
  <rect x="250" y="463" width="2" height="18" fill="#F8F8F2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Minimap indicator -->
  <rect x="870" y="89" width="30" height="411" fill="#1E1E2E"/>
  <rect x="872" y="100" width="26" height="200" fill="#3A3A4A" rx="2"/>
</svg>
