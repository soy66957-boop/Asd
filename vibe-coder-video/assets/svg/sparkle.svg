<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 4-point sparkle with glow -->
  <defs>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFD600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glow -->
  <circle cx="16" cy="16" r="14" fill="url(#sparkleGlow)" filter="url(#glow)"/>
  
  <!-- Sparkle cross -->
  <path d="M16 2 L16 30 M2 16 L30 16" stroke="#FFD600" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 6 L26 26 M26 6 L6 26" stroke="#FFD600" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="#FFD600"/>
</svg>
