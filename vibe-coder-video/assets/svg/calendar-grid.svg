<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar grid template: 4 rows x 7 cols -->
  <!-- Each cell: 100x100, gap: 8px -->
  <defs>
    <style>
      .day-number { font-family: Poppins, sans-serif; font-size: 28px; font-weight: 600; fill: #1A1A2E; }
      .day-name { font-family: Poppins, sans-serif; font-size: 18px; font-weight: 600; fill: #6A737D; }
    </style>
  </defs>
  
  <!-- Day names header -->
  <text x="50" y="30" class="day-name" text-anchor="middle">Mon</text>
  <text x="158" y="30" class="day-name" text-anchor="middle">Tue</text>
  <text x="266" y="30" class="day-name" text-anchor="middle">Wed</text>
  <text x="374" y="30" class="day-name" text-anchor="middle">Thu</text>
  <text x="482" y="30" class="day-name" text-anchor="middle">Fri</text>
  <text x="590" y="30" class="day-name" text-anchor="middle">Sat</text>
  <text x="698" y="30" class="day-name" text-anchor="middle">Sun</text>
  
  <!-- Grid cells -->
  <!-- Row 1 -->
  <rect x="0" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="50" y="85" class="day-number" text-anchor="middle">1</text>
  
  <rect x="108" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="158" y="85" class="day-number" text-anchor="middle">2</text>
  
  <rect x="216" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="266" y="85" class="day-number" text-anchor="middle">3</text>
  
  <rect x="324" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="374" y="85" class="day-number" text-anchor="middle">4</text>
  
  <rect x="432" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="482" y="85" class="day-number" text-anchor="middle">5</text>
  
  <rect x="540" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="590" y="85" class="day-number" text-anchor="middle">6</text>
  
  <rect x="648" y="40" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
