  <rect x="432" y="256" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
  <text x="482" y="301" class="day-number" text-anchor="middle">19</text>
  
  <rect x="540" y="256" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8E0FF" stroke-width="2"/>
