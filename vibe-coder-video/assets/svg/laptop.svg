<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- MacBook-style laptop -->
  <!-- Base/shadow -->
  <ellipse cx="300" cy="395" rx="180" ry="8" fill="#00000010"/>
  
  <!-- Bottom chassis -->
  <rect x="60" y="320" width="480" height="30" rx="4" fill="#E0E0E0"/>
  <rect x="60" y="320" width="480" height="30" rx="4" fill="url(#chassisGradient)"/>
  
  <!-- Screen hinge -->
  <rect x="270" y="310" width="60" height="10" rx="3" fill="#C0C0C0"/>
  
  <!-- Screen body -->
  <rect x="50" y="20" width="500" height="290" rx="12" fill="#1E1E2E"/>
  <rect x="50" y="20" width="500" height="290" rx="12" stroke="#3A3A4A" stroke-width="2" fill="none"/>
  
  <!-- Screen content area -->
  <rect x="70" y="50" width="460" height="240" rx="8" fill="#16161D"/>
  
  <!-- Code editor mockup -->
  <!-- Tab bar -->
  <rect x="70" y="50" width="460" height="36" rx="8" fill="#1E1E2E"/>
  <rect x="70" y="50" width="460" height="36" fill="url(#tabGradient)"/>
  <circle cx="100" cy="68" r="6" fill="#FF5F57"/>
  <circle cx="118" cy="68" r="6" fill="#FEBC2E"/>
  <circle cx="136" cy="68" r="6" fill="#28CA42"/>
  <text x="160" y="74" font-family="JetBrains Mono, monospace" font-size="12" fill="#8B8B8B">main.py</text>
  
  <!-- Code lines -->
  <text x="90" y="110" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#FF79C6">def</tspan> <tspan fill="#50FA7B">calculate_streak</tspan><tspan fill="#FF79C6">(</tspan><tspan fill="#F8F8F2">habits</tspan><tspan fill="#FF79C6">):</tspan></text>
  <text x="110" y="135" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#6272A4"># </tspan><tspan fill="#6272A4">Calculate current streak for each habit</tspan></text>
  <text x="110" y="160" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#8BE9FD">streaks</tspan> <tspan fill="#FF79C6">=</tspan> <tspan fill="#FF79C6">{</tspan></text>
  <text x="130" y="185" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#F1FA8C">"coding"</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#BD93F9">7</tspan><tspan fill="#FF79C6">,</tspan></text>
  <text x="130" y="210" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#F1FA8C">"workout"</tspan><tspan fill="#FF79C6">:</tspan> <tspan fill="#BD93F9">3</tspan><tspan fill="#FF79C6">,</tspan></text>
  <text x="110" y="235" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#FF79C6">}</tspan></text>
  <text x="110" y="260" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8F8F2"><tspan fill="#FF79C6">return</tspan> <tspan fill="#8BE9FD">streaks</tspan></text>
  
  <!-- Cursor blinking -->
  <rect x="280" y="258" width="2" height="18" fill="#F8F8F2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <defs>
    <linearGradient id="chassisGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
    <linearGradient id="tabGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D3A"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>
  </defs>
</svg>
