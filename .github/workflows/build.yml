name: CI

on:
  push:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run token guard
        run: bash tool/token_guard.sh

      - name: Run token guard self-test
        run: bash tool/token_guard_selftest.sh

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos 2>&1 | awk '
          /^  (error|warning) • / {
            # Parse: "  error • message • path:line:col • rule"
            level = $1
            # Find the message (between first • and second •)
            msg_start = index($0, "•") + 2
            msg_end = index(substr($0, msg_start), " • ")
            if (msg_end > 0) {
              msg_end = msg_start + msg_end - 1
              message = substr($0, msg_start, msg_end - msg_start)
              rest = substr($0, msg_end + 3)
              # rest is "path:line:col • rule"
              split(rest, parts, " • ")
              location = parts[1]
              rule = parts[2]
              split(location, loc, ":")
              file = loc[1]
              line = loc[2]
              col = loc[3]
              if (level == "error") {
                printf "::error file=%s,line=%s,col=%s::%s (%s)\n", file, line, col, message, rule
              } else {
                printf "::warning file=%s,line=%s,col=%s::%s (%s)\n", file, line, col, message, rule
              }
            }
            print $0
            next
          }
          { print }
          '

      - name: Test
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test/ directory, skipping tests"
          fi

  apk:
    name: Build Debug APK
    needs: analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Setup Debug Keystore
        run: |
          mkdir -p android/app
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties
          echo "storeFile=../.android/debug.keystore" >> android/key.properties

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipes-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  web:
    name: Build & Deploy Web
    needs: analyze
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Ensure Web Platform
        run: |
          if [ ! -d "web" ]; then
            flutter create . --platforms web
          fi

      - name: Build Web
        run: flutter build web --release --base-href "/Asd/"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
