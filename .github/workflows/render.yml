name: Render Vibe Coder Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vibe-coder-video/remotion/package-lock.json

      - name: Install dependencies
        working-directory: vibe-coder-video/remotion
        run: npm ci

      - name: Render video
        working-directory: vibe-coder-video/remotion
        run: npx remotion render VibeCoderVideo out/video.mp4 --codec=h264 --concurrency=4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-coder-video
          path: vibe-coder-video/remotion/out/video.mp4
          retention-days: 7
